server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation lets the in-browser AI use several CPU threads.
    # (nginx drops server-level add_header lines in locations that add their
    # own, so each location repeats them.)
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in asset names, so they can be cached for good.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The AI runtime changes rarely; cache it for a week. Its module scripts
    # must be served as JavaScript.
    location /ort/ {
        types {
            text/javascript mjs;
            application/wasm wasm;
        }
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "public, max-age=604800";
    }

    # Models and sample photos change rarely; cache them for a week.
    location ~ ^/(models|samples)/ {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "no-cache";
    }
}
